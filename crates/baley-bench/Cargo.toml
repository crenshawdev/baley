[package]
name = "baley-bench"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false
description = "Measurements of Baley's real ledger adapter."

[dependencies]
baley-store = { path = "../baley-store" }
baley-core = { path = "../baley-core" }
baley-store-sqlite = { path = "../baley-store-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
