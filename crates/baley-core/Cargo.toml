[package]
name = "baley-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Baley's domain: events, views, projectors and the rules that decide what may be recorded, behind the storage port."
repository = "https://github.com/crenshawdev/baley"
rust-version = "1.98"
publish = false

# The port and the three crates the ledger's evidence is made of. Adding an
# engine crate here fails CI (design 0001, EVD-R12).
[dependencies]
baley-store = { path = "../baley-store" }
serde = { version = "1", features = ["derive"] }
# No `preserve_order`: canonical order is this crate's job (RFC 8785), so the
# map behind `Value` may keep keys however it likes. `arbitrary_precision`
# keeps each number's source text, so `-0` is the integer 0 and `1.0` is not
# an integer. Stated here because the cadence crate turns it on for every
# workspace build, and the canonical bytes must not depend on what else is
# built alongside.
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
