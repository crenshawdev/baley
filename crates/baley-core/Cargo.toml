[package]
name = "baley-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Baley's domain: views, projectors and the rules that decide what may be recorded, behind the storage port."
repository = "https://github.com/crenshawdev/baley"
rust-version = "1.98"
publish = false

# The port, and JSON for the payloads the registry reads. Adding an engine
# crate here fails CI (design 0001, EVD-R12).
[dependencies]
baley-store = { path = "../baley-store" }
serde_json = "1"
