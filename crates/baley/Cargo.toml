[package]
name = "baley"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Baley, the owner's control plane for AI-assisted engineering: the binary that serves MCP, guards tool calls and keeps the evidence ledger."
repository = "https://github.com/crenshawdev/baley"
rust-version = "1.98"
publish = false

[dependencies]
baley-core = { path = "../baley-core" }
baley-store-sqlite = { path = "../baley-store-sqlite" }
clap = { version = "4", features = ["derive"] }
