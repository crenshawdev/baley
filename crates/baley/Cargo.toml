[package]
name = "baley"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Baley, the owner's control plane for AI-assisted engineering: the binary that serves MCP, guards tool calls and keeps the evidence ledger."
repository = "https://github.com/crenshawdev/baley"
rust-version = "1.98"
publish = false

[dependencies]
aho-corasick = "1.1.5"
baley-store = { path = "../baley-store" }
baley-core = { path = "../baley-core" }
baley-store-sqlite = { path = "../baley-store-sqlite" }
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
regex = "1"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.2.0", default-features = false, features = ["deserialize"] }
# `preserve_order` keeps every key a file already had in the order it had them,
# and `float_roundtrip` keeps a float this crate does not own byte-identical
# through a parse and re-serialize. Nothing in phase 1 rewrites a JSON file it
# did not author, so neither feature is load-bearing yet; they are declared here
# rather than later because the config and record layers that will do exactly
# that must not inherit them from a transitive enable another crate could drop.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
uuid = { version = "1.26", features = ["v4"] }
# ripgrep as a library: Baley ships one static binary per target with no
# runtime dependency on an external search program.
# The grep crates serve record search and risk diffs.
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"

# Test-only; never reaches the shipped binary. tempfile holds writable fixtures
# and negative-control copies.
[dev-dependencies]
tempfile = "3"
