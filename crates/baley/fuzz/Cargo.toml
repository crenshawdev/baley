[package]
name = "baley-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
baley = { path = ".." }
serde_json = "1"

# Its own workspace, so the main workspace and its Cargo.lock never see the fuzzer.
[workspace]
members = ["."]

[[bin]]
name = "mcp_frame"
path = "fuzz_targets/mcp_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_arguments"
path = "fuzz_targets/mcp_arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_input"
path = "fuzz_targets/hook_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "project_dir"
path = "fuzz_targets/project_dir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "update_manifest"
path = "fuzz_targets/update_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_import"
path = "fuzz_targets/model_import.rs"
test = false
doc = false
bench = false
